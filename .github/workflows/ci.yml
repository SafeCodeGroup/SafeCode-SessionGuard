name: CI

# One job, run natively on every supported OS and CPU. Every push to main lints,
# tests, builds and launch-tests the app; a v* tag also publishes the GitHub
# Release with all binaries.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # publish release files on tags
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            id: macos-arm64
            os: macos-latest
            exe: "dist/SafeCode SessionGuard.app/Contents/MacOS/SafeCodeSessionGuard"
          - name: macOS (Intel)
            id: macos-x86_64
            os: macos-15-intel
            exe: "dist/SafeCode SessionGuard.app/Contents/MacOS/SafeCodeSessionGuard"
          - name: Windows (x64)
            id: windows-x64
            os: windows-latest
            exe: dist/SafeCodeSessionGuard/SafeCodeSessionGuard.exe
          - name: Windows (ARM64)
            id: windows-arm64
            os: windows-11-arm
            exe: dist/SafeCodeSessionGuard/SafeCodeSessionGuard.exe
          - name: Linux (x86_64)
            id: linux-x86_64
            os: ubuntu-24.04
            exe: dist/SafeCodeSessionGuard/SafeCodeSessionGuard
          - name: Linux (ARM64)
            id: linux-aarch64
            os: ubuntu-24.04-arm
            exe: dist/SafeCodeSessionGuard/SafeCodeSessionGuard
    defaults:
      run:
        shell: bash
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Show build machine
        run: |
          echo "runner: $RUNNER_OS $RUNNER_ARCH"
          python -c "import platform, sys; print(platform.platform(), platform.machine(), sys.version)"

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository-2.0-dev libcairo2-dev pkg-config \
            gir1.2-ayatanaappindicator3-0.1 xvfb xprintidle dbus-x11
          # PyInstaller's GObject hooks need the GIRepository typelib to bundle
          # typelibs and gi.overrides; without it they silently skip them.
          sudo apt-get install -y gir1.2-girepository-3.0 || sudo apt-get install -y gir1.2-girepository-2.0

      - name: Create virtualenv
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = Windows ]; then VPY=.venv/Scripts/python.exe; else VPY=.venv/bin/python; fi
          echo "VPY=$VPY" >> "$GITHUB_ENV"
          $VPY -m pip install --upgrade pip
          $VPY -m pip install -r requirements-dev.txt

      - name: Lint
        run: |
          $VPY -m ruff check .
          $VPY -m ruff format --check .

      - name: Test
        run: $VPY -m pytest -q

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: scripts/build_macos.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/build_windows.ps1

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: scripts/build_linux.sh

      - name: Check binary architecture
        run: |
          ls -1 dist
          case "${{ matrix.id }}" in
            macos-*)   file "${{ matrix.exe }}" ;;
            linux-*)   file "${{ matrix.exe }}" ;;
            windows-*) $VPY -c "import struct,sys; d=open(sys.argv[1],'rb').read(4096); o=struct.unpack_from('<I',d,0x3c)[0]; m=struct.unpack_from('<H',d,o+4)[0]; print(sys.argv[1], {0x8664:'x64',0xAA64:'arm64'}.get(m,hex(m)))" "${{ matrix.exe }}" ;;
          esac
          ls dist | grep -q -- "-${{ matrix.id }}\." || { echo "No release file named for ${{ matrix.id }}"; exit 1; }

      - name: Self-test and launch test
        run: |
          headless() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a dbus-launch --exit-with-session "$@"; else "$@"; fi; }
          headless "${{ matrix.exe }}" --self-test selftest.txt || { cat selftest.txt; exit 1; }
          cat selftest.txt
          headless $VPY scripts/smoke_test.py "${{ matrix.exe }}"

      - name: "Linux: install test on Ubuntu 24.04"
        if: runner.os == 'Linux'
        run: HOME=$(mktemp -d) scripts/ci/linux_install_test.sh

      - name: "Linux: install test on Debian 13, Fedora, Arch"
        if: runner.os == 'Linux'
        run: |
          run() {
            echo "::group::$1"
            docker run --rm -v "$PWD:/w" -w /w "$1" bash -c "$2 >/dev/null && scripts/ci/linux_install_test.sh"
            echo "::endgroup::"
          }
          run debian:trixie "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xvfb xauth dbus python3 procps libayatana-appindicator3-1"
          run fedora:latest "dnf install -y xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon python3 \
            procps-ng libayatana-appindicator-gtk3 tar gzip"
          if [ "$(uname -m)" = x86_64 ]; then  # Arch publishes x86_64 images only
            run archlinux:latest "pacman -Syu --noconfirm xorg-server-xvfb xorg-xauth dbus python \
              procps-ng libayatana-appindicator tar gzip"
          fi

      - name: "Linux: run from source on Ubuntu 22.04 (system Python)"
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/w" -w /w ubuntu:22.04 bash -c "
            apt-get update >/dev/null && DEBIAN_FRONTEND=noninteractive apt-get install -y \
              python3-venv python3-dev build-essential python3-gi gir1.2-ayatanaappindicator3-0.1 \
              xprintidle xvfb xauth dbus procps >/dev/null && scripts/ci/source_run_test.sh"

      - name: "Linux: Docker cross-build"
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          OUT=dist-docker scripts/build_linux_docker.sh amd64
          tar -tzf dist-docker/SafeCodeSessionGuard-*-linux-x86_64.tar.gz \
            | grep -x 'SafeCodeSessionGuard/SafeCodeSessionGuard'

      - name: Show app log
        if: failure()
        run: |
          cat ~/Library/Logs/SafeCodeSessionGuard/*.log \
              ~/.config/SafeCodeSessionGuard/logs/*.log \
              "${APPDATA:-/nonexistent}"/SafeCodeSessionGuard/logs/*.log 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        with:
          name: SafeCodeSessionGuard-${{ matrix.id }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/publish_release.sh
